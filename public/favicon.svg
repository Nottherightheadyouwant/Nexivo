<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#121615" stop-opacity="1"/>
    </radialGradient>
    <filter id="borderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Squircle with Glow Border -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#121615" stroke="#5DCAA5" stroke-width="10" filter="url(#borderGlow)"/>

  <!-- Nexivo. Brand Logo Text -->
  <g transform="translate(256, 275)">
    <text text-anchor="middle" font-family="'Plus Jakarta Sans', 'Syne', Arial, sans-serif" font-weight="800" font-size="104" letter-spacing="-4">
      <tspan fill="#FFFFFF">Nex</tspan><tspan fill="#5DCAA5">ivo</tspan><tspan fill="#5DCAA5">.</tspan>
    </text>
  </g>
</svg>